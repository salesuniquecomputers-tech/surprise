<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Arohi ❤</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="scene">

    <!-- Background -->
    <div class="gold-glow"></div>
    <div class="stars"></div>
    <div id="particles"></div>

    <!-- Golden light -->
    <div class="light-rays"></div>

    <!-- Envelope -->
    <div class="envelope-area">

      <div class="envelope" id="envelope">

        <!-- Letter inside -->
        <div class="letter">

          <!-- Crystal Heart -->
          <div class="heart-wrap">

            <div class="heart">

              <div class="heart-shine"></div>
               <div class="heart-name">
                Arohi ❤️ 
              </div>

            </div>

          </div>

        </div>

        <!-- Envelope body -->
        <div class="envelope-body">

          <div class="front-name">
            
          </div>

          <div class="front-heart">
            ♥️
          </div>

        </div>

        <!-- Opening flap -->
        <div class="flap"></div>

        <!-- Golden wax seal -->
        <div class="seal">
          <span>♥️</span>
        </div>

      </div>

    </div>

    <!-- Button -->
    <button id="openBtn">
      💌 Open Letter
    </button>

    <!-- Final message -->
    <div class="final-message" id="finalMessage">
      <div>Made specially for</div>
      <strong>Arohi ❤</strong>
    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
